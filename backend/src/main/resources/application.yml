spring:
  application:
    name: trainconcierge
  profiles:
    default: dev
  config:
    # Spring Boot does not read .env files by itself, so local credentials set in
    # backend/.env (or the repository root) are imported here. Real environment
    # variables still win, and optional: keeps the app bootable when no .env exists.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Gmail is the default relay. Override MAIL_HOST/MAIL_PORT for any other provider.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # MAIL_USERNAME is the Gmail address; MAIL_USER is accepted for compatibility.
    username: ${MAIL_USERNAME:${MAIL_USER:}}
    # A Gmail App Password (16 characters, no spaces), never the account password.
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:15000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:15000}
  thymeleaf:
    cache: true
    check-template-location: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  auth:
    # How long a forgot-password link stays usable once it has been emailed.
    reset-token-ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:30}
  demo:
    password: ${DEMO_PASSWORD:}
  mail:
    enabled: ${MAIL_ENABLED:true}
    # Blank means "send from the signed-in SMTP account" (Gmail rejects a foreign From).
    from: ${MAIL_FROM:}
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:60000}
    retry-initial-delay-ms: ${MAIL_RETRY_INITIAL_DELAY_MS:60000}
  notifications:
    stream-timeout-ms: ${SSE_STREAM_TIMEOUT_MS:1800000}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:25000}
    heartbeat-initial-delay-ms: ${SSE_HEARTBEAT_INITIAL_DELAY_MS:25000}
  disruptions:
    hotel-unlock-hour: ${HOTEL_UNLOCK_HOUR:22}
    hotel-unlock-wait-hours: ${HOTEL_UNLOCK_WAIT_HOURS:6}
    rebooking-buffer-minutes: ${REBOOKING_BUFFER_MINUTES:30}
    station-transfer-minutes: ${STATION_TRANSFER_MINUTES:20}
    short-delay-minutes: ${SHORT_DELAY_MINUTES:60}
    fare-tolerance-percent: ${FARE_TOLERANCE_PERCENT:20}
    max-trains: 5
    max-buses: 3
    max-recommendations: 8
    savings-step-minutes: 30
    savings-step-points: 5
    savings-cap-points: 20
    earlier-arrival-points: 40
    same-class-points: 20
    higher-class-points: 5
    lower-class-points: 10
    fare-within-points: 10
    direct-service-points: 15
    train-type-points: 5
    bus-duration-points: 20
    wait-option-points: 60
