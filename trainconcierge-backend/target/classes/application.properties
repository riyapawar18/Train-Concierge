spring.application.name=trainconcierge-backend

server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/trainconcierge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Riyapawar054
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=TrainConciergeSecretKey2024SuperLongSecretForHS256AlgorithmMinimum256BitsRequired
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.trainconcierge=DEBUG
logging.level.org.springframework.security=INFO

# ─── Train data providers ──────────────────────────────────────────────────────
# RailRadar API (https://railradar.in/docs) — optional external train data source.
# Set RAILRADAR_API_KEY as an environment variable (never commit the real key).
# Free sandbox: 100 requests/month. Leave empty to use the local database only.
# Example: RAILRADAR_API_KEY=rr_live_xxxxxxxxxxxxxxxxxxxxxxxx
railradar.api.key=${RAILRADAR_API_KEY:}
